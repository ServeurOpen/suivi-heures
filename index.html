<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi d'heures</title>
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes heures">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--mut:#64748b;--acc:#2563eb;--acc2:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--txt:#f1f5f9;--mut:#94a3b8;--acc:#3b82f6;--acc2:#60a5fa;--line:#26334d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:18px 0 12px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.total{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;text-align:center}
.total .big{font-size:44px;font-weight:700;letter-spacing:-1px}
.total small{opacity:.85}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=date],input[type=time],input[type=number],input[type=email],input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt)}
.row{display:flex;gap:10px}.row>div{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.result{text-align:center;margin:16px 0 4px;font-size:15px;color:var(--mut)}
.result b{display:block;font-size:30px;color:var(--ok)}
.result b.neg{color:var(--bad)}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:8px}
button.main:active{background:var(--acc2)}
button.sec{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;padding:8px}
h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;color:var(--mut);text-transform:capitalize}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .d{flex:1}.item .d small{display:block;color:var(--mut)}
.item .h{font-weight:700}
.item button{background:none;border:0;font-size:18px;padding:6px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:20px 0}
footer{text-align:center}
</style>
</head>
<body>
<main>
<h1>⏱️ Mes heures</h1>

<div class="card total">
  <small>Total cumulé</small>
  <div class="big" id="grand">0h00</div>
  <small id="count">0 jour</small>
</div>

<div class="card">
  <div id="editBanner" style="display:none;color:var(--acc);font-size:14px;margin-bottom:4px">✏️ Modification en cours</div>
  <label for="date">Date</label>
  <input type="date" id="date">
  <div class="row">
    <div><label for="start">Arrivée</label><input type="time" id="start" value="08:00"></div>
    <div><label for="end">Départ</label><input type="time" id="end" value="17:00"></div>
  </div>
  <label>Pause</label>
  <div class="chips" id="chips"></div>
  <input type="number" id="pause" min="0" step="5" inputmode="numeric" style="margin-top:8px" placeholder="Minutes de pause">
  <div class="result">Heures travaillées<b id="res">0h00</b><span id="detail"></span></div>
  <button class="main" id="save">Enregistrer la journée</button>
  <button class="sec" id="cancel" style="display:none;width:100%">Annuler la modification</button>
</div>

<div id="list"></div>

<div class="card" id="auth" style="display:none">
  <h2><span>☁️ Synchronisation</span></h2>
  <input type="email" id="em" placeholder="E-mail" autocomplete="username">
  <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" style="margin-top:8px">
  <button class="main" id="login">Se connecter</button>
</div>
<div id="logged" style="display:none;text-align:center;color:var(--mut);font-size:14px"><span id="sync"></span> · <button class="sec" id="logout">Déconnexion</button></div>

<footer>
  <button class="sec" id="csv">Exporter en CSV</button>
</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const KEY='suivi-heures-v1';
const $=id=>document.getElementById(id);
let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let editId=null;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
let dirty=ld(KEY+'-dirty'),deleted=ld(KEY+'-del'); // ids à envoyer / à supprimer sur Supabase
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(KEY+'-dirty',JSON.stringify(dirty));localStorage.setItem(KEY+'-del',JSON.stringify(deleted))}catch(e){}};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmt=m=>{const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// durée en minutes (gère le passage de minuit)
function worked(s,e,p){let d=toMin(e)-toMin(s);if(d<0)d+=1440;return d-p}

const PAUSES=[0,15,30,45,60,90];
$('chips').innerHTML=PAUSES.map(p=>`<button type="button" class="chip" data-p="${p}">${p===0?'Aucune':p>=60?fmt(p):p+' min'}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('pause').value=b.dataset.p;calc()};

function calc(){
  const s=$('start').value,e=$('end').value,p=parseInt($('pause').value)||0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.p===p&&$('pause').value!==''));
  if(!s||!e){$('res').textContent='–';return null}
  const w=worked(s,e,p);
  $('res').textContent=fmt(w);$('res').classList.toggle('neg',w<0);
  let brut=toMin(e)-toMin(s);if(brut<0)brut+=1440;
  $('detail').textContent=`${fmt(brut)} − ${p} min de pause`;
  return w;
}
['start','end','pause'].forEach(i=>$(i).addEventListener('input',calc));

function reset(){
  editId=null;$('date').value=today();$('start').value='08:00';$('end').value='17:00';$('pause').value=30;
  $('editBanner').style.display=$('cancel').style.display='none';$('save').textContent='Enregistrer la journée';calc();
}
$('cancel').onclick=reset;

$('save').onclick=()=>{
  const w=calc();const date=$('date').value;
  if(!date||w===null)return alert('Remplis la date et les horaires.');
  if(w<0)return alert('La pause est plus longue que le temps passé.');
  const o={id:editId||Date.now().toString(36),date,start:$('start').value,end:$('end').value,pause:parseInt($('pause').value)||0,minutes:w};
  entries=entries.filter(x=>x.id!==o.id);entries.push(o);dirty.push(o.id);save();reset();render();sync();
  window.scrollTo({top:0,behavior:'smooth'});
};

function render(){
  entries.sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));
  const tot=entries.reduce((a,x)=>a+x.minutes,0);
  $('grand').textContent=fmt(tot);
  const days=new Set(entries.map(x=>x.date)).size;
  $('count').textContent=days+(days>1?' jours':' jour')+' · '+(Math.round(tot/6)/10)+' h décimales';
  if(!entries.length){$('list').innerHTML='<div class="card empty">Aucune journée enregistrée.</div>';return}
  const groups={};entries.forEach(x=>(groups[x.date.slice(0,7)]??=[]).push(x));
  $('list').innerHTML=Object.keys(groups).sort().reverse().map(k=>{
    const [y,m]=k.split('-');
    const name=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const sum=groups[k].reduce((a,x)=>a+x.minutes,0);
    return `<div class="card"><h2><span>${name}</span><span>${fmt(sum)}</span></h2>`+groups[k].map(x=>{
      const dt=new Date(x.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
      return `<div class="item"><div class="d">${dt}<small>${x.start} → ${x.end} · pause ${x.pause} min</small></div><span class="h">${fmt(x.minutes)}</span><button data-e="${x.id}" aria-label="Modifier">✏️</button><button data-d="${x.id}" aria-label="Supprimer">🗑️</button></div>`}).join('')+'</div>';
  }).join('');
}
$('list').onclick=e=>{
  const d=e.target.closest('[data-d]'),m=e.target.closest('[data-e]');
  if(d&&confirm('Supprimer cette journée ?')){const id=d.dataset.d;entries=entries.filter(x=>x.id!==id);dirty=dirty.filter(x=>x!==id);deleted.push(id);save();render();sync()}
  if(m){const x=entries.find(y=>y.id===m.dataset.e);editId=x.id;$('date').value=x.date;$('start').value=x.start;$('end').value=x.end;$('pause').value=x.pause;
    $('editBanner').style.display=$('cancel').style.display='block';$('save').textContent='Mettre à jour';calc();window.scrollTo({top:0,behavior:'smooth'})}
};

$('csv').onclick=()=>{
  const rows=['Date;Arrivée;Départ;Pause (min);Heures travaillées'].concat([...entries].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.start,x.end,x.pause,fmt(x.minutes)].join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'}));a.download='mes-heures.csv';a.click();
};

const SB_URL='https://ujwgmquwvsvmkmcxbaiq.supabase.co',SB_KEY='sb_publishable_4d6F9EL9xA9sUuG_0SmGjA_5Q2823HG';
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
async function sync(){
  if(!sb)return;
  const {data:{session}}=await sb.auth.getSession();
  $('auth').style.display=session?'none':'block';$('logged').style.display=session?'block':'none';
  if(!session)return;
  try{
    // 1re connexion : tout l'historique local part sur Supabase
    if(!localStorage.getItem(KEY+'-mig')){dirty=entries.map(x=>x.id);localStorage.setItem(KEY+'-mig','1')}
    if(deleted.length){const {error}=await sb.from('heures').delete().in('id',deleted);if(error)throw error;deleted=[]}
    const up=entries.filter(x=>dirty.includes(x.id)).map(({id,date,start,end,pause,minutes})=>({id,date,start,end,pause,minutes}));
    if(up.length){const {error}=await sb.from('heures').upsert(up);if(error)throw error}
    dirty=[];
    const {data,error}=await sb.from('heures').select('id,date,start,end,pause,minutes');if(error)throw error;
    entries=data;save();render();$('sync').textContent='☁️ Synchronisé';
  }catch(e){save();$('sync').textContent='⚠️ Synchro impossible, réessai plus tard'}
}
$('login').onclick=async()=>{
  if(!sb)return alert('Pas de connexion internet.');
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)return alert('Connexion impossible : '+error.message);
  sync();
};
$('logout').onclick=async()=>{await sb.auth.signOut();sync()};
addEventListener('online',sync);
reset();render();sync();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
